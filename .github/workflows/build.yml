
name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./DevExpressReportMVCDemo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Begin SonarQube Analysis
        run: |
          dotnet sonarscanner begin \
            /k:"ShubhamG2908_devexpress-web-reporting_33cc1e54-6925-491a-bdeb-578fb5bc662a" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore Dependencies
        run: dotnet restore MyApplication.sln

      - name: Build Solution
        run: |
          dotnet build DevExpressReportMVCDemo.sln \
            --no-restore \
            --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test DevExpressReportMVCDemo.sln \
            --no-build \
            --configuration Release

      - name: End SonarQube Analysis
        if: always()
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
